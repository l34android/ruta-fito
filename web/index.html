  <a class="skip" href="#details">Saltar a la lista de paradas</a>

  <header class="top">
    <div class="brand">
      <svg class="icon brand-icon" aria-hidden="true"><use href="#i-route"/></svg>
      <span class="brand-name">Ruta Fito</span>
      <span class="brand-sub">Berisso → Arroyito</span>
    </div>
    <p class="signal" id="signal" role="status" aria-live="polite">
      <span class="signal-dot" aria-hidden="true"></span><span id="signal-text">Cargando la ruta…</span>
    </p>
  </header>

  <main class="layout">
    <section class="next card" id="next" aria-labelledby="next-name" aria-live="polite" aria-atomic="true">
      <p class="eyebrow">Próxima parada</p>
      <div class="next-head">
        <span class="type-tile type-tile--lg" id="next-icon" aria-hidden="true"></span>
        <div>
          <h1 class="next-name" id="next-name">—</h1>
          <p class="next-type" id="next-type"></p>
        </div>
      </div>
      <dl class="stats">
        <div class="stat"><dt>km</dt><dd id="next-km">—</dd></div>
        <div class="stat"><dt>llegada</dt><dd id="next-eta">—</dd></div>
        <div class="stat"><dt>minutos</dt><dd id="next-min">—</dd></div>
      </dl>
      <p class="next-desc" id="next-desc"></p>
      <p class="note" id="next-fito-wrap"><svg class="icon" aria-hidden="true"><use href="#i-dog"/></svg><span id="next-fito"></span></p>
      <a class="btn btn-primary" id="next-waze" href="#" target="_blank" rel="noopener">
        <svg class="icon" aria-hidden="true"><use href="#i-brand-waze"/></svg>Abrir en Waze
      </a>
    </section>

    <section class="map-wrap" aria-label="Mapa de la ruta">
      <div id="map"></div>
      <button class="map-btn" id="follow" type="button" aria-pressed="true">
        <svg class="icon" aria-hidden="true"><use href="#i-current-location"/></svg><span>Seguirme</span>
      </button>
    </section>

    <section class="details" id="details" aria-label="Paradas por día">
      <div class="segmented" role="tablist" aria-label="Día de viaje" id="tabs"></div>
      <dl class="day-stats" id="day-stats"></dl>
      <ol class="list card" id="stops"></ol>
      <div class="tools">
        <button class="btn btn-secondary" id="copy-waze" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg>Copiar paradas para Waze
        </button>
        <a class="btn btn-secondary" id="bot-link" href="#" target="_blank" rel="noopener">
          <svg class="icon" aria-hidden="true"><use href="#i-brand-telegram"/></svg>Abrir el bot
        </a>
      </div>
      <p class="footnote">Te aviso por Telegram unos 20 a 35 minutos antes de cada parada, mientras compartas tu ubicación en tiempo real con el bot.</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
