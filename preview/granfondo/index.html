<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Lean en el Gran Fondo 7 Lagos</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<symbol id="i-heart" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572" /></symbol>
<symbol id="i-bolt" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11" /></symbol>
<symbol id="i-rotate-clockwise" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4.05 11a8 8 0 1 1 .5 4m-.5 5v-5h5" /></symbol>
<symbol id="i-gauge" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /><path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M13.41 10.59l2.59 -2.59" /><path d="M7 12a5 5 0 0 1 5 -5" /></symbol>
<symbol id="i-map" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 7l6 -3l6 3l6 -3v13l-6 3l-6 -3l-6 3v-13" /><path d="M9 4v13" /><path d="M15 7v13" /></symbol>
<symbol id="i-chart-area-line" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 19l4 -6l4 2l4 -5l4 4l0 5l-16 0" /><path d="M4 12l3 -4l4 2l5 -6l4 4" /></symbol>
<symbol id="i-mountain" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 20h18l-6.921 -14.612a2.3 2.3 0 0 0 -4.158 0l-6.921 14.612" /><path d="M7.5 11l2 2.5l2.5 -2.5l2 3l2.5 -2" /></symbol>
<symbol id="i-message-circle" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1" /></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M10 14l11 -11" /><path d="M21 3l-6.5 18a.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a.55 .55 0 0 1 0 -1l18 -6.5" /></symbol>
<symbol id="i-external-link" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M12 6h-6a2 2 0 0 0 -2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-6" /><path d="M11 13l9 -9" /><path d="M15 4h5v5" /></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M5 5a5 5 0 0 1 7 0a5 5 0 0 0 7 0v9a5 5 0 0 1 -7 0a5 5 0 0 0 -7 0v-9" /><path d="M5 21v-7" /></symbol>
<symbol id="i-map-pin" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /><path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0" /></symbol>
<symbol id="i-bike" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M2 18a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /><path d="M16 18a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /><path d="M12 19v-4l-3 -3l5 -4l2 3h3" /><path d="M13.007 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /></symbol>
</svg>
  <div id="map" aria-label="Mapa del recorrido con la posición de Lean"></div>

  <header class="hud card" id="hud" aria-labelledby="hud-title">
    <div class="uci" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="hud-top">
      <h1 id="hud-title">Lean · Gran Fondo 7 Lagos</h1>
      <p class="live" role="status" aria-live="polite"><span class="dot" id="dot" aria-hidden="true"></span><span id="live-text">Cargando</span></p>
    </div>
    <p class="km"><span id="km">0</span> <span class="km-of">de <span id="total">108</span> km</span></p>
    <div class="bar" role="progressbar" id="progress" aria-label="Avance del recorrido" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="fill"></span></div>
    <dl class="facts">
      <div><dt>Llega</dt><dd id="m-eta">—</dd></div>
      <div><dt>En carrera</dt><dd id="m-time">—</dd></div>
      <div><dt>Promedio</dt><dd id="m-avg">—</dd></div>
    </dl>
    <p class="climb" id="climb"><svg class="icon" aria-hidden="true"><use href="#i-mountain"/></svg><span id="climb-text">—</span></p>
  </header>

  <section class="sensors card" id="sensors" aria-label="Datos del Karoo en vivo">
    <dl>
      <div class="sensor" id="s-hr"><dt><svg class="icon" aria-hidden="true"><use href="#i-heart"/></svg><span class="sr">Pulso</span></dt><dd><span class="v">—</span><span class="u">ppm</span></dd></div>
      <div class="sensor" id="s-power"><dt><svg class="icon" aria-hidden="true"><use href="#i-bolt"/></svg><span class="sr">Potencia</span></dt><dd><span class="v">—</span><span class="u">W</span></dd></div>
      <div class="sensor" id="s-cadence"><dt><svg class="icon" aria-hidden="true"><use href="#i-rotate-clockwise"/></svg><span class="sr">Cadencia</span></dt><dd><span class="v">—</span><span class="u">rpm</span></dd></div>
      <div class="sensor" id="s-speed"><dt><svg class="icon" aria-hidden="true"><use href="#i-gauge"/></svg><span class="sr">Velocidad</span></dt><dd><span class="v">—</span><span class="u">km/h</span></dd></div>
    </dl>
    <p class="sensors-note" id="sensors-note">Esperando datos del Karoo</p>
  </section>

  <section class="sheet" id="sheet-perfil" role="dialog" aria-modal="true" aria-labelledby="perfil-title" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="perfil-title">Perfil</h2><button class="btn btn-secondary" type="button" data-close>Cerrar</button></div>
    <div class="sheet-body">
      <p class="meta" id="gain"></p>
      <div id="profile" class="profile" role="img" aria-label="Perfil de altura del recorrido con la posición de Lean"></div>
      <h3 class="sub-h">Subidas</h3>
      <ol class="climbs card" id="climbs"></ol>
      <div class="links" id="links" hidden></div>
    </div>
  </section>

  <section class="sheet" id="sheet-aliento" role="dialog" aria-modal="true" aria-labelledby="aliento-title" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="aliento-title">Aliento</h2><button class="btn btn-secondary" type="button" data-close>Cerrar</button></div>
    <ol class="chat" id="chat" aria-live="polite" aria-relevant="additions"></ol>
    <form class="composer" id="composer" autocomplete="off">
      <div class="field" id="name-field"><label for="name">Tu nombre</label><input id="name" maxlength="30"></div>
      <label class="msg-label" for="text">Mensaje para Lean <button type="button" class="link" id="who" hidden></button></label>
      <div class="compose-row"><textarea id="text" maxlength="500" rows="1"></textarea><button class="btn btn-primary" type="submit" id="send"><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>Enviar</button></div>
      <p class="form-error" id="form-error" role="alert"></p>
    </form>
  </section>

  <nav class="tabbar" aria-label="Secciones">
    <button class="tab" type="button" data-tab="mapa" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-map"/></svg><span>Mapa</span></button>
    <button class="tab" type="button" data-tab="perfil" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#i-chart-area-line"/></svg><span>Perfil</span></button>
    <button class="tab" type="button" data-tab="aliento" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#i-message-circle"/></svg><span>Aliento</span><span class="badge" id="badge" hidden>0</span></button>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
