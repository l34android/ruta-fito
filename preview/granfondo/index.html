<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06121f">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Lean en el Gran Fondo 7 Lagos</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<symbol id="i-bike" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M2 18a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /><path d="M16 18a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /><path d="M12 19v-4l-3 -3l5 -4l2 3h3" /><path d="M13.007 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M12 7v5l3 3" /></symbol>
<symbol id="i-gauge" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /><path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M13.41 10.59l2.59 -2.59" /><path d="M7 12a5 5 0 0 1 5 -5" /></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M5 5a5 5 0 0 1 7 0a5 5 0 0 0 7 0v9a5 5 0 0 1 -7 0a5 5 0 0 0 -7 0v-9" /><path d="M5 21v-7" /></symbol>
<symbol id="i-mountain" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 20h18l-6.921 -14.612a2.3 2.3 0 0 0 -4.158 0l-6.921 14.612" /><path d="M7.5 11l2 2.5l2.5 -2.5l2 3l2.5 -2" /></symbol>
<symbol id="i-map-pin" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /><path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0" /></symbol>
<symbol id="i-message-circle" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1" /></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M10 14l11 -11" /><path d="M21 3l-6.5 18a.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a.55 .55 0 0 1 0 -1l18 -6.5" /></symbol>
<symbol id="i-external-link" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M12 6h-6a2 2 0 0 0 -2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-6" /><path d="M11 13l9 -9" /><path d="M15 4h5v5" /></symbol>
<symbol id="i-trophy" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M8 21l8 0" /><path d="M12 17l0 4" /><path d="M7 4l10 0" /><path d="M17 4v8a5 5 0 0 1 -10 0v-8" /><path d="M3 9a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M17 9a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /></symbol>
<symbol id="i-route" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 19a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M19 7a2 2 0 1 0 0 -4a2 2 0 0 0 0 4" /><path d="M11 19h5.5a3.5 3.5 0 0 0 0 -7h-8a3.5 3.5 0 0 1 0 -7h4.5" /></symbol>
<symbol id="i-trending-up" viewBox="0 0 24 24"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 17l6 -6l4 4l8 -8" /><path d="M14 7l7 0l0 7" /></symbol>
</svg>
  <div class="uci" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <header class="head">
    <div>
      <p class="eyebrow">Gran Fondo 7 Lagos · 110 km</p>
      <h1>Lean en carrera</h1>
      <p class="sub">San Martín de los Andes → Villa La Angostura · domingo 22 de noviembre</p>
    </div>
    <p class="live" id="live" role="status" aria-live="polite"><span class="dot" id="dot" aria-hidden="true"></span><span id="live-text">Cargando…</span></p>
  </header>

  <main class="grid">
    <section class="col">
      <article class="card hero" aria-labelledby="km-label">
        <p class="eyebrow" id="km-label">Recorrido</p>
        <p class="km"><span id="km">0</span><span class="of">/ <span id="total">110</span> km</span></p>
        <div class="progress" role="progressbar" aria-labelledby="km-label" aria-valuemin="0" aria-valuemax="100" id="progress">
          <span class="fill" id="fill"></span>
          <div class="lakes" id="lake-ticks" aria-hidden="true"></div>
        </div>
        <p class="pct" id="pct">Largada a confirmar</p>
      </article>

      <dl class="metrics">
        <div class="card metric"><dt><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>Tiempo</dt><dd id="m-time">—</dd></div>
        <div class="card metric"><dt><svg class="icon" aria-hidden="true"><use href="#i-gauge"/></svg>Promedio</dt><dd id="m-avg">—</dd></div>
        <div class="card metric"><dt><svg class="icon" aria-hidden="true"><use href="#i-trending-up"/></svg>Ahora</dt><dd id="m-cur">—</dd></div>
        <div class="card metric"><dt><svg class="icon" aria-hidden="true"><use href="#i-flag"/></svg>Llegada</dt><dd id="m-eta">—</dd></div>
      </dl>

      <article class="card climb" id="climb" aria-live="polite">
        <span class="climb-ico" aria-hidden="true"><svg class="icon"><use href="#i-mountain"/></svg></span>
        <div><p class="eyebrow" id="climb-eyebrow">Próxima subida</p><p class="climb-text" id="climb-text">—</p></div>
      </article>

      <article class="card profile-card" aria-labelledby="prof-title">
        <div class="card-head"><h2 id="prof-title">Altimetría</h2><p class="meta" id="gain"></p></div>
        <div id="profile" class="profile" role="img" aria-label="Perfil de altura del recorrido con la posición de Lean"></div>
      </article>
    </section>

    <section class="col">
      <div class="card map-card"><div id="map" aria-label="Mapa del recorrido"></div></div>
      <div class="links" id="links" hidden></div>
      <article class="card chat-card" aria-labelledby="chat-title">
        <div class="card-head"><h2 id="chat-title">Aliento</h2><p class="meta">Mensajes para Lean</p></div>
        <ol class="chat" id="chat" aria-live="polite" aria-relevant="additions"></ol>
        <form class="composer" id="composer" autocomplete="off">
          <div class="field" id="name-field"><label for="name">Tu nombre</label><input id="name" maxlength="30"></div>
          <label class="msg-label" for="text">Mensaje <button type="button" class="link" id="who" hidden></button></label>
          <div class="row"><textarea id="text" maxlength="500" rows="1"></textarea><button class="btn" type="submit" id="send"><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>Enviar</button></div>
          <p class="form-error" id="form-error" role="alert"></p>
        </form>
      </article>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
