  <div id="map" aria-label="Mapa del viaje"></div>

  <header class="status card" role="status" aria-live="polite">
    <span class="status-avatar" id="status-avatar" aria-hidden="true"></span>
    <div class="status-text">
      <p class="status-title">Lean y Fito</p>
      <p class="status-sub"><span class="dot" id="dot" aria-hidden="true"></span><span id="status-sub">Cargando…</span></p>
    </div>
  </header>

  <!-- Next-stop mini card (Apple Music "now playing" pattern) -->
  <button class="mini card" id="mini" type="button" aria-haspopup="dialog" aria-controls="sheet-ruta">
    <span class="type-tile" id="mini-icon" aria-hidden="true"></span>
    <span class="mini-text">
      <span class="eyebrow" id="mini-eyebrow">Próxima parada</span>
      <span class="mini-name" id="mini-name">—</span>
      <span class="mini-meta" id="mini-meta"></span>
    </span>
    <svg class="icon mini-chev" aria-hidden="true"><use href="#i-chevron-right"/></svg>
  </button>

  <section class="sheet" id="sheet-ruta" role="dialog" aria-modal="true" aria-labelledby="ruta-title" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="ruta-title">Ruta</h2><button class="btn btn-secondary" type="button" data-close>Cerrar</button></div>
    <div class="sheet-body">
      <div class="segmented" role="tablist" aria-label="Día de viaje" id="days"></div>
      <dl class="day-stats" id="day-stats"></dl>
      <ol class="list card" id="stops"></ol>
    </div>
  </section>

  <section class="sheet" id="sheet-sala" role="dialog" aria-modal="true" aria-labelledby="sala-title" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="sala-title">Sala</h2><button class="btn btn-secondary" type="button" data-close>Cerrar</button></div>
    <ol class="chat" id="chat" aria-live="polite" aria-relevant="additions"></ol>
    <form class="composer" id="composer" autocomplete="off">
      <div class="field" id="name-field">
        <label for="name">Tu nombre</label>
        <input id="name" name="name" maxlength="30">
      </div>
      <label class="msg-label" for="text">Mensaje <button type="button" class="link" id="who" hidden></button></label>
      <div class="compose-row">
        <textarea id="text" name="text" maxlength="500" rows="1"></textarea>
        <button class="btn btn-primary send" type="submit" id="send"><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>Enviar</button>
      </div>
      <p class="form-error" id="form-error" role="alert"></p>
    </form>
  </section>

  <nav class="tabbar" aria-label="Secciones">
    <button class="tab" type="button" data-tab="mapa" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-map"/></svg><span>Mapa</span></button>
    <button class="tab" type="button" data-tab="ruta" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#i-list-details"/></svg><span>Ruta</span></button>
    <button class="tab" type="button" data-tab="sala" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#i-message-circle"/></svg><span>Sala</span><span class="badge" id="badge" hidden>0</span></button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="fito.js"></script>
  <script src="app.js"></script>
</body>
</html>
