name: Deploy Ruta Fito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test worker/test/*.test.js && rm -f worker/src/trip.built.js

      - name: Derive webhook secret from bot token
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: |
          test -n "$TG_TOKEN" || { echo "::error::Falta el secreto TG_TOKEN"; exit 1; }
          S=$(printf '%s' "ruta-fito:$TG_TOKEN" | sha256sum | cut -c1-48)
          echo "::add-mask::$S"
          echo "WEBHOOK_SECRET=$S" >> "$GITHUB_ENV"

      - name: Cloudflare bootstrap (account, workers.dev, KV)
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cf-setup.mjs

      - name: Build route, stops and webapp
        env:
          WORKER_URL: ${{ steps.cf.outputs.worker_url }}
          BOT_USERNAME: travel_guide_fito_bot
        run: node scripts/build.mjs

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: |
          npx --yes wrangler@3 deploy
          printf '%s' "$TG_TOKEN" | npx --yes wrangler@3 secret put TG_TOKEN
          printf '%s' "$WEBHOOK_SECRET" | npx --yes wrangler@3 secret put WEBHOOK_SECRET

      - name: Register Telegram webhook
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          WORKER_URL: ${{ steps.cf.outputs.worker_url }}
        run: |
          curl -sf "https://api.telegram.org/bot${TG_TOKEN}/setWebhook" \
            --data-urlencode "url=${WORKER_URL}/tg" \
            --data-urlencode "secret_token=${WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message","edited_message"]' | head -c 300; echo
          curl -sf "https://api.telegram.org/bot${TG_TOKEN}/setMyCommands" \
            -H 'Content-Type: application/json' \
            -d '{"commands":[{"command":"estado","description":"Dónde estoy y próxima parada"},{"command":"plan","description":"Plan de los dos días"},{"command":"ruta","description":"Abrir el mapa"},{"command":"compartir","description":"Link para la familia"},{"command":"cargue","description":"Anotar que cargué nafta"},{"command":"familia","description":"Usar este grupo para avisos (en el grupo)"}]}' | head -c 200; echo
          echo "Health:"; sleep 5; curl -s "${WORKER_URL}/health" | head -c 400; echo

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - id: pages
        uses: actions/deploy-pages@v4
