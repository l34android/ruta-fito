name: Preview modo 8 bits

on:
  push:
    branches: ['feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test worker/test/*.test.js && rm -f worker/src/trip.built.js worker/src/race.built.js

      - name: Derive forward secret from bot token
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: |
          test -n "$TG_TOKEN" || { echo "::error::Falta el secreto TG_TOKEN"; exit 1; }
          F=$(printf '%s' "ruta-fito-forward:$TG_TOKEN" | sha256sum | cut -c1-48)
          echo "::add-mask::$F"
          echo "FORWARD_SECRET=$F" >> "$GITHUB_ENV"
          K=$(printf '%s' "ruta-fito-karoo:$TG_TOKEN" | sha256sum | cut -c1-64)
          echo "::add-mask::$K"
          echo "KAROO_KEY=$K" >> "$GITHUB_ENV"
          echo "APK_NAME=$(printf '%s' "$K" | sha256sum | cut -c1-24)" >> "$GITHUB_ENV"

      - name: Cloudflare bootstrap (preview KV)
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET: preview
          # SHA-256 of the existing family link token (the token itself never goes in the repo)
          SHARE_SHA256: b6281e4d1fc3ffe7f79086e328528334ab35b5a75adf2feebc9781066cc24341
        run: node scripts/cf-setup.mjs

      - name: Build route and apps
        run: node scripts/build.mjs

      - name: Build Gran Fondo course (route, elevation, climbs, lakes)
        run: node scripts/build-race.mjs

      - name: Keep one signing key for the Karoo APK (so updates install over the old one)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: karoo-debug-keystore-v1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Karoo extension APK
        id: karoo
        continue-on-error: true
        env:
          INGEST_URL: ${{ steps.cf.outputs.worker_url }}/api/telemetry
        run: |
          git clone -q --depth 1 https://github.com/hammerheadnav/karoo-ext /tmp/karoo-ext
          echo "karoo-ext $(git -C /tmp/karoo-ext rev-parse --short HEAD)"
          cp -r karoo/rutafito /tmp/karoo-ext/rutafito
          sed -i 's/^include(.*/include(":lib", ":rutafito")/' /tmp/karoo-ext/settings.gradle.kts
          cd /tmp/karoo-ext && ./gradlew --no-daemon --console=plain :rutafito:assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/dist/preview/karoo"
          cp rutafito/build/outputs/apk/release/rutafito-release.apk "$GITHUB_WORKSPACE/dist/preview/karoo/$APK_NAME.apk"
          ls -l "$GITHUB_WORKSPACE/dist/preview/karoo" | sed "s/$APK_NAME/<apk>/"
          echo "karoo apk built"

      - name: Deploy preview Worker (assets + Durable Object)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          npx --yes wrangler@3 deploy -c wrangler.preview.toml
          printf '%s' "$TG_TOKEN" | npx --yes wrangler@3 secret put TG_TOKEN -c wrangler.preview.toml
          printf '%s' "$FORWARD_SECRET" | npx --yes wrangler@3 secret put FORWARD_SECRET -c wrangler.preview.toml
          printf '%s' "$KAROO_KEY" | npx --yes wrangler@3 secret put KAROO_KEY -c wrangler.preview.toml
          if [ -n "$SPOTIFY_CLIENT_ID" ] && [ -n "$SPOTIFY_CLIENT_SECRET" ]; then
            printf '%s' "$SPOTIFY_CLIENT_ID" | npx --yes wrangler@3 secret put SPOTIFY_CLIENT_ID -c wrangler.preview.toml
            printf '%s' "$SPOTIFY_CLIENT_SECRET" | npx --yes wrangler@3 secret put SPOTIFY_CLIENT_SECRET -c wrangler.preview.toml
          else echo "Spotify secrets not set yet"; fi
          sleep 5; curl -s -o /dev/null -w "preview root: %{http_code}\n" "${{ steps.cf.outputs.worker_url }}/"
          curl -s -o /dev/null -w "karoo apk: %{http_code} %{size_download} bytes\n" "${{ steps.cf.outputs.worker_url }}/karoo/$APK_NAME.apk"

      - name: Migrate KV state into the Durable Object store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
          KV_ID: ${{ steps.cf.outputs.kv_id }}
          WORKER_URL: ${{ steps.cf.outputs.worker_url }}
        run: node scripts/migrate-kv.mjs
