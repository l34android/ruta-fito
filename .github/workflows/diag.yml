name: Diagnóstico servidor
on:
  push:
    branches: ['diag/**']
permissions:
  contents: write
  actions: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Geocode day 3 places
        run: node scripts/geo-lookup.mjs | tee diag-output.txt
      - name: Save output to the branch
        if: always()
        run: |
          true
          git config user.name diag-bot; git config user.email diag@users.noreply.github.com
          git add diag-output.txt && git commit -m "diag output 7 [skip ci]" && git push
