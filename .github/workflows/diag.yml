name: Diagnóstico servidor
on:
  push:
    branches: ['diag/**']
permissions:
  contents: write
  actions: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build output of the last deploys (route, times, fuel)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee diag-output.txt) 2>&1
          for W in deploy.yml preview.yml; do
            gh run list -R ${{ github.repository }} --workflow $W -L 1 --json headSha,status,conclusion -q '.[0] | "'$W' \(.headSha[0:7]) \(.status) \(.conclusion)"'
          done
          RID=$(gh run list -R ${{ github.repository }} --workflow preview.yml -L 1 --json databaseId -q '.[0].databaseId')
          gh run view -R ${{ github.repository }} $RID --log | grep -E "course:|gain|climb |lake|profile|race|##\[error\]|preview root" | sed -E 's/^.*Z //' | head -40
          U=https://ruta-fito-preview.ruta-fito-4e6efe.workers.dev
          curl -s -o /dev/null -w "granfondo page: %{http_code}\n" $U/granfondo/
          curl -s $U/granfondo/race.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log("race.json",r.totalKm,"km gain",r.gain,"climbs",r.climbs.length,"lakes",r.lakes.map(l=>l.name+"@"+l.km).join(", "),"profile",r.profile.length)})'
          curl -s -w " api: %{http_code}\n" "$U/api/granfondo?k=bad" | head -c 200; echo
      - name: Save output to the branch
        if: always()
        run: |
          true
          git config user.name diag-bot; git config user.email diag@users.noreply.github.com
          git add diag-output.txt && git commit -m "diag output 9 [skip ci]" && git push
