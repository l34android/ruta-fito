name: Diagnóstico servidor
on:
  push:
    branches: ['diag/**']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check endpoints after the fix
        run: |
          exec > >(tee diag-output.txt) 2>&1
          B=https://ruta-fito-4e6efe.workers.dev
          for u in "https://ruta-fito.ruta-fito-4e6efe.workers.dev/status" "https://ruta-fito.ruta-fito-4e6efe.workers.dev/public?k=x" "https://ruta-fito-preview.ruta-fito-4e6efe.workers.dev/api/public?k=x" "https://ruta-fito-preview.ruta-fito-4e6efe.workers.dev/nueva/"; do
            curl -s -o b.txt -w "%{http_code} $u\n" "$u"; head -c 160 b.txt | tr -d '\n'; echo
          done
      - name: Save output to the branch
        if: always()
        run: |
          sed -i -E 's/[A-Za-z0-9_-]{30,}/[redacted]/g' diag-output.txt
          git config user.name diag-bot; git config user.email diag@users.noreply.github.com
          git add diag-output.txt && git commit -m "diag output 2 [skip ci]" && git push
