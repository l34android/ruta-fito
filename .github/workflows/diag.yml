name: Diagnóstico servidor
on:
  push:
    branches: ['diag/**']
permissions:
  contents: write
  actions: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build output of the last deploys (route, times, fuel)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee diag-output.txt) 2>&1
          node geo.mjs
      - name: Save output to the branch
        if: always()
        run: |
          true
          git config user.name diag-bot; git config user.email diag@users.noreply.github.com
          git add diag-output.txt && git commit -m "diag output 13 [skip ci]" && git push
