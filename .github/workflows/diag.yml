name: Diagnóstico servidor
on:
  push:
    branches: ['diag/**']
permissions:
  contents: write
  actions: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build output of the last deploys (route, times, fuel)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee diag-output.txt) 2>&1
          for W in deploy.yml preview.yml; do
            gh run list -R ${{ github.repository }} --workflow $W -L 1 --json headSha,status,conclusion -q '.[0] | "'$W' \(.headSha[0:7]) \(.status) \(.conclusion)"'
          done
          RID=$(gh run list -R ${{ github.repository }} --workflow deploy.yml -L 1 --json databaseId -q '.[0].databaseId')
          gh run view -R ${{ github.repository }} $RID --log | grep -E "d[123]: |  [0-9]{2}:[0-9]{2}  km|km without fuel|imported|##\[error\]" | sed -E 's/^.*Z //' | head -40
      - name: Save output to the branch
        if: always()
        run: |
          true
          git config user.name diag-bot; git config user.email diag@users.noreply.github.com
          git add diag-output.txt && git commit -m "diag output 8 [skip ci]" && git push
